<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kupovina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fffdf7;
      border: 2px solid #d8d0bc;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.09);
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.2rem;
      color: #2e7d32;
      margin-bottom: 12px;
    }

    p {
      color: #8a7e6a;
      font-size: 1.05rem;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    a.btn {
      display: inline-block;
      background: #2e7d32;
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 10px;
      transition: background 0.2s ease;
    }

    a.btn:hover { background: #1b5e20; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛒 Kupovina</h1>
    <p>Podsetnik za kupovinu namirnica.<br>Kliknite na dugme da otvorite listu.</p>
    <a class="btn" href="kupi.html" target="_blank">Otvori listu</a>
  </div>
</body>
</html>
